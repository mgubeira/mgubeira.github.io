cv:
  name: Maria Giulia Ubeira Gabellini, PhD
  label: Senior AI Researcher & Physicist
  email: ubeira.mariagiulia@hsr.it
  location: Milan, Italy

  summary: >
    Experienced in system modeling and big data analytics with a strong Physics and Mathematics foundation.
    Since 2021, proven expertise in clinical application systems implementation and optimization.
    Passionate interdisciplinary problem solver with expertise in image post-processing, data analysis, and statistical modeling across multiple programming languages.
    Proven ability to integrate diverse techniques and collaborate effectively in teams while adapting to new challenges and technologies.
    **Topics:** big data processing and analysis, deep learning, advanced modeling, breast cancer radiotherapy, probabilistic segmentation, fluid dynamics, multi-wavelength imaging.

  sections:
    Experience:
      - company: IRCCS Ospedale San Raffaele, MP-DReAM Group
        position: Senior AI Researcher & Physicist
        location: Milan, Italy
        start_date: 2021-12
        summary: >
          Prediction of toxicity/outcome of patient treatment through the development of automatic procedures
          (e.g., image anonymization, radiomic/densitometric/dosimetric feature extraction) for CT and MRI images.
          ML models (e.g., LightGBM) on large datasets (e.g., NET, breast, bowel, anesthesia) for classification,
          regression and survival prediction, with explainability analysis using SHAP. Bounding boxes and
          auto-segmentation of breast CTV with DL (e.g., nnU-Net, SAM2). Inter- and intra-center probabilistic CTV map
          prediction, temporally validated. Synthetic CT generation from MRI using DL (CycleGAN, diffusion models,
          transformers) for SBRT.
        highlights:
          - "Positions funded by: IPMN (PNRR, 2026-present); MIKAPOCo (AIRC, UniSR, 2025); PerPlanRT (EU, 2021-2024)"
          - "Ongoing collaborations: C. Fiorino (supervisor), Prof. R. Jeraj (Ljubljana, Madison), L. Placidi (Gemelli), T. Rancati (INT), Prof. S. Carrazza (UniMi), Prof. M. Potenza (UniMi)"
          - "Scientific visitor at University of Ljubljana (May 2023), with Prof. R. Jeraj and L. Rivetti"

      - company: ATG Artificial Intelligence Srl
        position: Data Scientist and Software Developer
        location: Erba, Italy
        start_date: 2021-02
        end_date: 2021-12
        summary: >
          Study of the consistency of temporal correlations between adjacent frames. Predictions on large biomedical
          datasets using Decision Trees, Random Forest, Neural Networks, Logistic Regression. Large time series
          prediction using DL (e.g., LSTM).

      - company: AISent Srl
        position: Data Scientist (freelance)
        location: Dalmine, Italy
        start_date: 2020-09
        end_date: 2020-11
        summary: >
          Computer Vision for healthcare through CNNs (chest radiography illness identification, brain tumor
          segmentation); multi-camera tracking for people re-identification in crowded scenarios.

      - company: Monash University, RISE-2018 project DUSTBUSTERS
        position: Secondment
        location: Melbourne, Australia
        start_date: 2019-06
        end_date: 2019-08
        summary: Collaboration with Prof. D. Price, Dr. C. Pinte and V. Christiaens using VIP, PHANTOM and MCFOST.

